<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Terrenos cerca de Lamas</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script src="vendor/leaflet/leaflet.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a222c;
    --card: #232d3a;
    --text: #e8eef4;
    --muted: #9aabbc;
    --accent: #3d9cf0;
    --good: #3ecf8e;
    --warn: #f0b429;
    --border: #2e3a48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  header.topbar {
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  header.topbar h1 {
    font-size: 1.05rem; margin: 0; font-weight: 700; letter-spacing: 0.01em;
    line-height: 1.2; flex: 1; min-width: 0;
  }
  header.topbar h1 .flag-1 { color: #3B6BFF; } /* azul bandera Lamas */
  header.topbar h1 .flag-2 { color: #F5E000; } /* amarillo */
  header.topbar h1 .flag-3 { color: #E10600; } /* rojo */
  .filters-toggle {
    display: none;
    flex-shrink: 0;
    margin: 0;
    width: auto;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    min-height: 40px;
    white-space: nowrap;
  }
  /* meta/saveStatus kept for JS, not shown (frees map/list space) */
  .site-footer {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
    padding: 0;
    margin: -1px;
  }
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .filter-checks {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    padding-top: 2px;
  }
  .filter-checks label.check {
    flex-direction: row; align-items: center; gap: 8px;
    text-transform: none; letter-spacing: 0; font-size: 0.88rem;
    color: var(--text); cursor: pointer; user-select: none;
  }
  .filter-checks input[type="checkbox"] {
    width: 18px; height: 18px; min-width: 18px; accent-color: var(--accent);
    cursor: pointer;
  }

  .filter-checks-wrap .filter-label {
    font-size: 0.72rem; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.03em; margin-bottom: 6px;
  }
  .filters .span-2.filter-checks-wrap { align-self: start; }


  .filters input, .filters select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 10px; min-width: 110px; font-size: 0.9rem;
  }
  .filters button {
    background: var(--accent); color: #041018; border: none; border-radius: 8px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; height: 36px;
  }
  .filters button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  main { flex: 1; display: grid; grid-template-columns: 1.05fr 1fr; min-height: 0; }
  #map { height: 100%; background: #15202b; }
  .list-pane { overflow: auto; padding: 14px 14px 20px; border-left: 1px solid var(--border); background: #0c1117; }
  .card {
    background: var(--card);
    border: 2px solid #3a4a5c;
    border-radius: 14px;
    padding: 14px 14px 14px 16px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: border-color .15s, transform .15s, box-shadow .15s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    position: relative;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 4px;
    border-radius: 4px;
    background: #4a5d72;
  }
  .list-pane .card:nth-child(odd) {
    background: #232d3a;
  }
  .list-pane .card:nth-child(even) {
    background: #1a222c;
    border-color: #45566a;
  }
  .list-pane .card:nth-child(even)::before { background: #3d9cf0; }
  .list-pane .card:nth-child(odd)::before { background: #6b7f94; }
  .card:hover, .card.active {
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(61,156,240,0.18);
  }
  .card h2 { margin: 0 0 8px; font-size: 1.02rem; line-height: 1.3; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .price { color: var(--good); font-weight: 700; font-size: 1.05rem; }
  .price.unknown { color: var(--warn); }
  .pill {
    font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
    background: #2a3644; color: var(--muted);
  }
  .pill.deal { background: #1e3d32; color: var(--good); }
  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .gallery a { display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: #111820; }
  .gallery img {
    width: 100%; height: 120px; object-fit: cover; display: block;
  }
  .gallery-count { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
  .desc { color: var(--muted); font-size: 0.85rem; line-height: 1.45; white-space: pre-wrap; }
  .desc.clamp { max-height: 4.2em; overflow: hidden; }
  .toggle-desc { background: none; border: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 0.82rem; font-weight: 600; }
  a.fb {
    display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; font-size: 0.88rem;
  }
  .leaflet-popup-content { margin: 10px 12px; min-width: 180px; }
  .popup-title { font-weight: 700; margin-bottom: 4px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }

  .interest-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .interest-row button {
    border-radius: 8px; border: 1px solid var(--border); background: #1b2430;
    color: var(--text); padding: 6px 10px; font-size: 0.8rem; cursor: pointer;
  }
  .interest-row button.active-yes { background: #1e3d32; border-color: var(--good); color: var(--good); }
  .interest-row button.active-no { background: #3a2222; border-color: #e07171; color: #f0a0a0; }
  .pill.lote { background: #2a3a4a; color: #9fd0ff; }
  .pill.terreno { background: #2e3a2a; color: #b7e0a8; }
  .card.dimmed { opacity: 0.45; }

  body {
    min-height: 100dvh;
    height: 100dvh;
  }

  .view-tabs { display: none; }

  .map-wrap { display: contents; }
  .detail-pane { display: none; }
  @media (max-width: 900px) {
    main.show-map {
      grid-template-rows: 1fr;
    }
    main.show-map .map-wrap {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }
    main.show-map #map {
      flex: 1 1 42%;
      min-height: 180px;
      height: auto;
    }
    main.show-map .detail-pane {
      display: block;
      flex: 1 1 58%;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 10px;
    }
    main.show-map .detail-pane[hidden] {
      display: none;
    }
    main.show-map .detail-pane:not([hidden]) + .list-pane,
    main.show-map .list-pane { }
    main.show-map.has-detail #map {
      flex: 0 0 38%;
      max-height: 38dvh;
    }
    .detail-pane .card { margin-bottom: 0; }
    .detail-empty {
      color: var(--muted);
      text-align: center;
      padding: 24px 12px;
      font-size: 0.92rem;
      line-height: 1.4;
    }
  }

  .view-tabs {
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .view-tabs button {
    flex: 1;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .view-tabs button.active {
    background: var(--accent);
    color: #041018;
    border-color: var(--accent);
  }
  @media (max-width: 900px) {
    body {
      height: 100dvh;
      overflow: hidden;
    }
    header.topbar {
      padding: 6px 10px;
      gap: 8px;
      flex-shrink: 0;
    }
    header.topbar h1 { font-size: 0.95rem; line-height: 1.2; }
    .filters-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      min-height: 40px;
      font-size: 0.85rem;
    }
    .view-tabs { display: flex; flex-shrink: 0; }
    .filters {
      display: none;
      flex-shrink: 0;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 12px 12px;
      align-items: stretch;
      max-height: min(42dvh, 360px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border-bottom: 1px solid var(--border);
    }
    .filters.open { display: grid; }
    .filters label { min-width: 0; }
    .filters label.span-2 { grid-column: 1 / -1; }
    .filters input, .filters select {
      min-width: 0;
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      min-height: 44px;
    }
    .filters .filter-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
    }
    .filters button {
      flex: 1;
      height: 44px;
      font-size: 0.95rem;
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }
    main.show-map .map-wrap { display: flex; }
    main.show-map .list-pane { display: none; }
    main.show-list .map-wrap { display: none; }
    main.show-list .list-pane { display: block; }
    #map, .list-pane {
      min-height: 0;
      height: 100%;
      border: none;
    }
    .list-pane {
      padding: 10px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .card { padding: 14px 14px 14px 16px; border-radius: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 1.02rem; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .gallery img { height: 100px; }
    .interest-row button {
      flex: 1;
      min-height: 44px;
      font-size: 0.9rem;
    }
    a.fb { padding: 8px 0; display: inline-block; }
    .leaflet-popup-content { min-width: 140px; max-width: 70vw; }
  }

  .leaflet-tooltip.mobile-hide { display: none !important; }
  @media (max-width: 900px) {
    .leaflet-tooltip { display: none !important; }
  }
  @media (max-width: 420px) {
    .filters { grid-template-columns: 1fr; }
  }


  /* Full listing page overlay */
  #listingPage {
    display: none; position: fixed; inset: 0; z-index: 5000;
    background: var(--bg); overflow: auto; -webkit-overflow-scrolling: touch;
  }
  #listingPage.open { display: block; }
  #listingPage .lp-top {
    position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center;
    padding: 10px 14px; background: rgba(15,20,25,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  #listingPage .lp-top button, #listingPage .lp-top a.btn {
    appearance: none; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 10px; padding: 10px 14px; font: inherit; cursor: pointer;
    text-decoration: none; font-size: 14px;
  }
  #listingPage .lp-top .lp-title {
    flex: 1; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #listingPage .lp-body { max-width: 980px; margin: 0 auto; padding: 14px 14px 48px; }
  #listingPage .lp-gallery {
    position: relative; background: #0a0e13; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); aspect-ratio: 4/3; max-height: min(62vh, 560px);
  }
  #listingPage .lp-gallery img.main {
    width: 100%; height: 100%; object-fit: contain; display: block; background: #0a0e13;
  }
  #listingPage .lp-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: rgba(0,0,0,0.55); color: #fff; font-size: 22px; cursor: pointer;
  }
  #listingPage .lp-nav.prev { left: 10px; }
  #listingPage .lp-nav.next { right: 10px; }
  #listingPage .lp-count {
    position: absolute; bottom: 10px; right: 12px; background: rgba(0,0,0,0.6);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; color: #fff;
  }
  #listingPage .lp-thumbs {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scroll-snap-type: x mandatory;
  }
  #listingPage .lp-thumbs button {
    flex: 0 0 auto; width: 72px; height: 54px; padding: 0; border: 2px solid transparent;
    border-radius: 8px; overflow: hidden; background: #111; cursor: pointer; scroll-snap-align: start;
  }
  #listingPage .lp-thumbs button.active { border-color: var(--accent); }
  #listingPage .lp-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #listingPage .lp-price { font-size: 28px; font-weight: 700; margin: 14px 0 6px; }
  #listingPage .lp-price.unknown { color: var(--warn); font-size: 20px; }
  #listingPage .lp-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  #listingPage .lp-section { margin: 18px 0; }
  #listingPage .lp-section h3 { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }
  #listingPage .lp-desc { white-space: pre-wrap; line-height: 1.45; font-size: 15px; }
  #listingPage .lp-deals { background: #1e2a22; border: 1px solid #2f4a3a; border-radius: 10px; padding: 12px; color: #b8e0c8; }
  #listingPage .card-thumb {
    width: 100%; height: 160px; object-fit: cover; border-radius: 10px; display: block;
    background: #111; margin-bottom: 10px; border: 1px solid var(--border);
  }
  #listingPage .lp-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .card .open-listing {
    display: inline-block; margin-top: 8px; margin-right: 8px;
    border: 1px solid var(--accent); background: #1a2a3a; color: var(--accent);
    border-radius: 10px; padding: 10px 12px; font: inherit; cursor: pointer; font-size: 14px;
  }
  .card .thumb-wrap { margin-bottom: 10px; }
  .card .thumb-wrap img {
    width: 100%; height: 150px; object-fit: cover; border-radius: 10px;
    border: 1px solid var(--border); background: #111; display: block;
  }
  .card .thumb-wrap .thumb-count {
    font-size: 12px; color: var(--muted); margin-top: 4px;
  }

  .card.is-new {
    border-color: #3ecf8e;
    box-shadow: 0 0 0 1px rgba(62,207,142,0.35), 0 8px 24px rgba(0,0,0,0.25);
  }
  .pill.new {
    background: #1e3d32; color: var(--good); border: 1px solid #3ecf8e; font-weight: 700;
  }
  .marker-new {
    background: #3ecf8e; border: 2px solid #fff; border-radius: 50%;
    width: 14px; height: 14px; margin-left: -7px; margin-top: -7px;
    box-shadow: 0 0 0 3px rgba(62,207,142,0.35);
  }
</style>
</head>
<body>
<header class="topbar">
  <h1 id="siteTitle"><span class="flag-1">Terrenos</span><span class="flag-2"> cerca de </span><span class="flag-3">Lamas</span></h1>
  <button type="button" class="filters-toggle" id="filtersToggle" aria-expanded="false">Filtros</button>
</header>
<div class="filters" id="filtersPanel">
  <label>Distancia máx. (km)
    <input type="number" id="maxDist" min="0" step="1" placeholder="cualquiera" />
  </label>
  <label>Precio mín. (PEN)
    <input type="number" id="minPrice" min="0" step="1000" placeholder="cualquiera" />
  </label>
  <label>Precio máx. (PEN)
    <input type="number" id="maxPrice" min="0" step="1000" placeholder="cualquiera" />
  </label>
  <label>Tamaño mín. (m²)
    <input type="number" id="minM2" min="0" step="50" placeholder="cualquiera" />
  </label>
  <label>Tamaño mín. (ha)
    <input type="number" id="minHa" min="0" step="0.1" placeholder="cualquiera" />
  </label>
  <label class="span-2">Ordenar por
    <select id="sortBy">
      <option value="distance">Distancia</option>
      <option value="best_offers">Mejores ofertas</option>
      <option value="price_asc">Precio ↑</option>
      <option value="price_desc">Precio ↓</option>
      <option value="size_desc">Tamaño ↓</option>
      <option value="new_first">Nuevos primero</option>
      <option value="newest">Más reciente</option>
    </select>
  </label>
  <label class="span-2">Solo ofertas
    <select id="dealsOnly">
      <option value="no">No</option>
      <option value="yes">Sí</option>
    </select>
  </label>
  <label class="span-2">Novedad
    <select id="newOnly">
      <option value="no">Todos</option>
      <option value="yes">Solo nuevos de hoy</option>
    </select>
  </label>
  <label class="span-2">Tipo de parcela
    <select id="parcelType">
      <option value="all">Todos</option>
      <option value="lote">Solo lotes</option>
      <option value="not_lote">No es lote</option>
      <option value="unclear">No claro</option>
    </select>
  </label>
  <div class="span-2 filter-checks-wrap" id="interestFilter">
    <div class="filter-label">Interés <span style="font-weight:400;text-transform:none;opacity:.75">(combinable)</span></div>
    <div class="filter-checks">
      <label class="check"><input type="checkbox" name="interest" value="interested" /> Me interesa</label>
      <label class="check"><input type="checkbox" name="interest" value="not_interested" /> No me interesa</label>
      <label class="check"><input type="checkbox" name="interest" value="unmarked" /> Sin marcar</label>
    </div>
  </div>
  <div class="filter-actions">
    <button type="button" id="apply">Aplicar</button>
    <button type="button" class="secondary" id="reset">Restablecer</button>
  </div>
</div>
<div class="view-tabs" id="viewTabs" role="tablist">
  <button type="button" id="tabMap" class="active" role="tab" aria-selected="true">Mapa</button>
  <button type="button" id="tabList" role="tab" aria-selected="false">Anuncios</button>
</div>
<main id="mainPanes" class="show-map">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="detail-pane" id="detailPane" hidden>
      <div class="detail-pane-inner" id="detailPaneInner"></div>
    </div>
  </div>
  <div class="list-pane" id="list"></div>
</main>
<footer class="site-footer" aria-hidden="true">
  <div id="meta"></div>
  <div id="saveStatus"></div>
</footer>

<div id="listingPage" aria-hidden="true">
  <div class="lp-top">
    <button type="button" id="lpBack">← Volver</button>
    <div class="lp-title" id="lpTopTitle"></div>
    <a class="btn" id="lpFb" href="#" target="_blank" rel="noopener">Facebook ↗</a>
  </div>
  <div class="lp-body" id="lpBody"></div>

function saveStatusEl() {

function normalizeInterest(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [id, v] of Object.entries(raw)) {
    if (!v) continue;
    if (typeof v === 'string') out[id] = { status: v, updated_at: null };
    else if (v.status) out[id] = { status: v.status, updated_at: v.updated_at || null };
  }
  return out;
}
function getInterest(id) {
  const row = interestMap[String(id)];

}
function persistInterest() {
  try {
    localStorage.setItem(INTEREST_KEY, JSON.stringify(interestMap));
    if (saveStatusEl()) saveStatusEl().textContent = 'Marcas guardadas en este navegador · ' + new Date().toLocaleTimeString();
  } catch (e) {
    if (saveStatusEl()) saveStatusEl().textContent = 'No se pudieron guardar las marcas en este navegador';

}
async function loadInterestFromFile() {
  // Static hosting: localStorage is source of truth. Optional interest.json seeds first visit only.
  try {
    const local = localStorage.getItem(INTEREST_KEY);

      interestMap = normalizeInterest(JSON.parse(local));

      return;

  try {
    const res = await fetch('interest.json', { cache: 'no-store' });

      if (saveStatusEl()) saveStatusEl().textContent = 'Marcas: cargadas desde interest.json';

  for (const f of (l.value_flags || [])) {
    if (f === 'free_or_contact_price' || f === 'placeholder_or_unusually_low_price') continue;
    score += offerScoreWeights[f] || (dealFlags.has(f) ? 1 : 0);
  }
  if (l.is_new) score += 1;
  // Prefer known prices slightly over unknown when otherwise tied
  if (!l.price_unknown && l.sort_price != null) score += 0.25;
  return score;
}

function sizeLabel(l) {
  if (l.size_ha && l.size_ha >= 0.5) return l.size_ha + ' ha';
  if (l.size_m2) return Math.round(l.size_m2).toLocaleString('en-US') + ' m²';
  return 'Tamaño n/d';
}

function locationConfidenceLabel(c) {
  if (c === 'exact') return 'Ubicación exacta';
  if (c === 'approximate') return 'Ubicación aprox.';
  if (c === 'unknown') return 'Ubicación desconocida';
  return c || 'Ubicación n/d';
}
function listedLabel(l) {
  if (l.listed_text) return 'Publicado: ' + l.listed_text;
  if (l.listed_at) {
    try { return 'Publicado: ' + new Date(l.listed_at).toLocaleDateString(); }
    catch { return 'Publicado: ' + l.listed_at; }
  }
  return 'Publicado: desconocido';
}

function filtered() {
  const maxDist = num('maxDist');
  const minPrice = num('minPrice');
  const maxPrice = num('maxPrice');
  const minM2 = num('minM2');
  const minHa = num('minHa');
  const dealsOnly = document.getElementById('dealsOnly').value === 'yes';
  const parcelType = document.getElementById('parcelType').value;
  const interestChecks = [...document.querySelectorAll('#interestFilter input[name="interest"]:checked')].map(el => el.value);
  let rows = DATA.listings.slice();
  rows = rows.filter(l => {
    if (maxDist != null && (l.distance_km == null || l.distance_km > maxDist)) return false;
    if (minPrice != null && (l.sort_price == null || l.sort_price < minPrice)) return false;
    if (maxPrice != null && (l.sort_price == null || l.sort_price > maxPrice)) return false;
    if (minM2 != null && (l.size_m2 == null || l.size_m2 < minM2)) return false;
    if (minHa != null && (l.size_ha == null || l.size_ha < minHa)) return false;
    if (dealsOnly && !isDeal(l)) return false;
    if (parcelType === 'lote' && l.is_lote !== true) return false;
    if (parcelType === 'not_lote' && l.is_lote !== false) return false;
    if (parcelType === 'unclear' && l.is_lote !== null) return false;
    const interest = getInterest(l.id);
    if (interestChecks.length) {
      const bucket = interest == null ? 'unmarked' : interest;
      if (!interestChecks.includes(bucket)) return false;
    }
    const newOnly = document.getElementById('newOnly')?.value === 'yes';
    if (newOnly && !l.is_new) return false;
    return true;
  });
  const sortBy = document.getElementById('sortBy').value;
  rows.sort((a, b) => {
    if (sortBy === 'best_offers') {
      const ds = offerScore(b) - offerScore(a);
      if (ds) return ds;
      // tie-break: closer to Lamas, then cheaper
      const dd = (a.distance_km ?? 999) - (b.distance_km ?? 999);
      if (dd) return dd;
      return (a.sort_price ?? 1e15) - (b.sort_price ?? 1e15);
    }
    if (sortBy === 'new_first') {
      const dn = (b.is_new ? 1 : 0) - (a.is_new ? 1 : 0);
      if (dn) return dn;
      return (b.first_seen_at || b.scraped_at || '').localeCompare(a.first_seen_at || a.scraped_at || '');
    }
    if (sortBy === 'price_asc') return (a.sort_price ?? 1e15) - (b.sort_price ?? 1e15);
    if (sortBy === 'price_desc') return (b.sort_price ?? -1) - (a.sort_price ?? -1);
    if (sortBy === 'size_desc') return (b.size_m2 ?? 0) - (a.size_m2 ?? 0);
    if (sortBy === 'newest') return (b.scraped_at || '').localeCompare(a.scraped_at || '');
    return (a.distance_km ?? 999) - (b.distance_km ?? 999);
  });
  return rows;
}

function num(id) {
  const v = document.getElementById(id).value;
  if (v === '' || v == null) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function clearMarkers() {
  if (!map) { markers = []; return; }
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}


function listingById(id) {
  return DATA.listings.find(x => x.id === id);
}

function cardHtml(l, { openDesc = false } = {}) {
  const fotos = l.photos || [];
  const gallery = fotos.length
    ? '<div class="gallery">' + fotos.map((src, i) =>
        '<a href="' + esc(src) + '" target="_blank" rel="noopener" title="Foto ' + (i+1) + '">' +
        '<img src="' + esc(src) + '" alt="Foto ' + (i+1) + '" loading="lazy" />' +
        '</a>').join('') + '</div><div class="gallery-count">' + (fotos.length === 1 ? '1 foto' : fotos.length + ' fotos') + '</div>'
    : '<div class="gallery-count">Aún no hay fotos</div>';
  const pills = [];
  if (l.is_new) pills.push('<span class="pill new">Nuevo</span>');
  if (isDeal(l)) pills.push('<span class="pill deal">Vale la pena</span>');
  if (l.price_unknown) pills.push('<span class="pill">Precio desconocido</span>');
  if (l.reduced_from) pills.push('<span class="pill">Antes ' + esc(String(l.reduced_from)) + '</span>');
  pills.push('<span class="pill">' + esc(locationConfidenceLabel(l.location_confidence)) + '</span>');
  if (l.is_lote === true) pills.push('<span class="pill lote">Lote</span>');
  else if (l.is_lote === false) pills.push('<span class="pill terreno">No es lote</span>');
  else pills.push('<span class="pill">Parcela no clara</span>');
  const interest = getInterest(l.id);
  const dim = interest === 'not_interested' ? ' dimmed' : '';
  const neu = l.is_new ? ' is-new' : '';
  const descClass = openDesc ? 'desc full-ad' : 'desc clamp full-ad';
  const toggleLabel = openDesc ? 'Ocultar anuncio' : 'Ver anuncio completo';
  const thumb = (fotos[0]
    ? '<div class="thumb-wrap"><img src="' + esc(fotos[0]) + '" alt="" loading="lazy" /><div class="thumb-count">' +
      (fotos.length === 1 ? '1 foto' : fotos.length + ' fotos') + '</div></div>'
    : '');
  return '<article class="card' + dim + neu + '" id="card-' + esc(l.id) + '" data-id="' + esc(l.id) + '">' +
    thumb +
    '<h2>' + esc(l.title) + '</h2>' +
    '<div class="row"><span class="price' + (l.price_unknown ? ' unknown' : '') + '">' + esc(l.price_display) + '</span>' +
    pills.join('') + '</div>' +
    '<div class="row"><span class="pill">' + esc(sizeLabel(l)) + '</span>' +
    '<span class="pill">' + (l.distance_km != null ? l.distance_km + ' km desde Lamas' : 'Distancia n/d') + '</span>' +
    '<span class="pill">' + esc(l.place_label || l.location_text || '') + '</span>' +
    '<span class="pill">' + esc(listedLabel(l)) + '</span></div>' +
    (l.deals_notes ? '<div class="desc deals">' + esc(l.deals_notes) + '</div>' : '') +
    '<div class="' + descClass + '" data-full="1">' + esc(l.description || '(Sin texto del anuncio)') + '</div>' +
    '<button type="button" class="toggle-desc">' + toggleLabel + '</button>' +
    gallery +
    '<button type="button" class="open-listing" data-open-listing="' + esc(l.id) + '">Ver ficha completa</button>' +
    '<a class="fb" href="' + esc(l.url) + '" target="_blank" rel="noopener">Abrir anuncio en Facebook ↗</a>' +
    '<div class="interest-row">' +
      '<button type="button" class="mark-yes' + (interest === 'interested' ? ' active-yes' : '') + '" data-mark="interested">Me interesa</button>' +
      '<button type="button" class="mark-no' + (interest === 'not_interested' ? ' active-no' : '') + '" data-mark="not_interested">No me interesa</button>' +
      '<button type="button" class="mark-clear" data-mark="clear">Quitar</button>' +
    '</div>' +
    '</article>';
}

function wireCardHandlers(root) {
  // Interest + desc toggles use document capture delegation (see below).
  // Kept so showMapDetail / render can call it safely.
  void root;
}

function showMapDetail(id) {
  const pane = document.getElementById('detailPane');
  const inner = document.getElementById('detailPaneInner');
  const mainEl = document.getElementById('mainPanes');
  if (!pane || !inner) return;
  const l = listingById(id);
  if (!l) return;
  activeId = id;
  pane.hidden = false;
  if (mainEl) mainEl.classList.add('has-detail');
  inner.innerHTML = cardHtml(l, { openDesc: true });
  wireCardHandlers(inner);
  if (map) setTimeout(() => map.invalidateSize(), 80);
  // Open matching marker popup lightly without requiring FB
  const mk = markers.find(m => {
    const ll = m.getLatLng();
    return l.lat != null && Math.abs(ll.lat - l.lat) < 1e-8 && Math.abs(ll.lng - l.lng) < 1e-8;
  });
  if (mk && mk.getPopup()) {
    try { mk.openPopup(); } catch (_) {}
  }
}

function clearMapDetail() {
  const pane = document.getElementById('detailPane');
  const inner = document.getElementById('detailPaneInner');
  const mainEl = document.getElementById('mainPanes');
  if (pane) pane.hidden = true;
  if (inner) inner.innerHTML = '<div class="detail-empty">Toca un pin del mapa para ver fotos y detalles aquí.</div>';
  if (mainEl) mainEl.classList.remove('has-detail');
  if (map) setTimeout(() => map.invalidateSize(), 80);
}

function popupHtml(l) {
  if (typeof isMobile === 'function' && isMobile()) {
    return '<div class="popup-title">' + esc(l.title) + '</div>' +
      '<div><b>' + esc(l.price_display) + '</b></div>' +
      '<div>' + esc(sizeLabel(l)) + '</div>' +
      '<div style="color:#9aabbc;font-size:12px;margin-top:4px">Detalles y fotos abajo ↓</div>';
  }
  return '<div class="popup-title">' + esc(l.title) + '</div>' +
    '<div><b>' + esc(l.price_display) + '</b></div>' +
    '<div>' + esc(sizeLabel(l)) + ' · ' + (l.distance_km != null ? l.distance_km + ' km' : '? km') + '</div>' +
    '<div style="color:#667">' + esc(l.place_label) + ' (' + esc(locationConfidenceLabel(l.location_confidence)) + ')</div>' +
    '<div>' + esc(listedLabel(l)) + '</div>' +
    '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">Abrir en Facebook</a>';
}

function render() {
  const rows = filtered();
  const nNew = DATA.listings.filter(x => x.is_new).length;
  document.getElementById('meta').textContent =
    rows.length + ' de ' + DATA.listings.length + ' anuncios' +
    (nNew ? (' · ' + nNew + ' nuevo' + (nNew === 1 ? '' : 's') + ' hoy') : '') +
    ' · actualizado ' + new Date(DATA.generated_at).toLocaleString('es-PE', { timeZone: 'America/Lima' });

  clearMarkers();
  const list = document.getElementById('list');
  if (!rows.length) {
    list.innerHTML = '<div class="empty">Ningún anuncio coincide con estos filtros.</div>';
    return;
  }
  const bounds = [];
  list.innerHTML = rows.map(l => {
    if (map && typeof L !== 'undefined' && l.lat != null) {
      const m = l.is_new
        ? L.marker([l.lat, l.lng], { icon: L.divIcon({ className: '', html: '<div class="marker-new"></div>', iconSize: [14,14], iconAnchor: [7,7] }) })
        : L.marker([l.lat, l.lng]);
      // Mobile: popup only (tooltip+popup overlap on tap). Desktop: hover tooltip + click popup.
      if (typeof isMobile === 'function' && isMobile()) {
        m.bindPopup(popupHtml(l), { maxWidth: 260, closeButton: true, autoPan: true });
      } else {
        m.bindTooltip(popupHtml(l), { direction: 'top', opacity: 0.95, sticky: true });
        m.bindPopup(popupHtml(l), { maxWidth: 280 });
      }
      m.on('click', () => {
        openListing(l.id);
      });
      m.addTo(map);
      markers.push(m);
      bounds.push([l.lat, l.lng]);
    }
    return cardHtml(l);
  }).join('');

  wireCardHandlers(list);
  list.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('a, button')) return;
      openListing(el.dataset.id);
    });
  });

    if (map && bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
}

function focusCard(id, pan) {
  activeId = id;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  const card = document.getElementById('card-' + id);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const l = DATA.listings.find(x => x.id === id);
  if (map && pan && l && l.lat != null) {
    map.flyTo([l.lat, l.lng], Math.max(map.getZoom(), 12), { duration: 0.6 });
    const m = markers.find(mk => {
      const ll = mk.getLatLng();
      return Math.abs(ll.lat - l.lat) < 1e-9 && Math.abs(ll.lng - l.lng) < 1e-9;
    });
    if (m) m.openPopup();
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('apply').onclick = render;
document.getElementById('reset').onclick = () => {
  ['maxDist','minPrice','maxPrice','minM2','minHa'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('sortBy').value = 'distance';
  document.getElementById('dealsOnly').value = 'no';
  const newOnlyEl = document.getElementById('newOnly');
  if (newOnlyEl) newOnlyEl.value = 'no';
  document.getElementById('parcelType').value = 'all';
  document.querySelectorAll('#interestFilter input[name="interest"]').forEach(el => { el.checked = false; });
  render();
};


const filtersToggle = document.getElementById('filtersToggle');
const filtersPanel = document.getElementById('filtersPanel');
const mainPanes = document.getElementById('mainPanes') || document.querySelector('main');
const tabMap = document.getElementById('tabMap');
const tabList = document.getElementById('tabList');

function setMobileView(which) {
  if (!mainPanes) return;
  if (!isMobile()) {
    mainPanes.classList.remove('show-map', 'show-list', 'has-detail');
    const pane = document.getElementById('detailPane');
    if (pane) pane.hidden = true;
    return;
  }
  const showMap = which === 'map';
  mainPanes.classList.toggle('show-map', showMap);
  mainPanes.classList.toggle('show-list', !showMap);
  if (tabMap && tabList) {
    tabMap.classList.toggle('active', showMap);
    tabList.classList.toggle('active', !showMap);
    tabMap.setAttribute('aria-selected', showMap ? 'true' : 'false');
    tabList.setAttribute('aria-selected', showMap ? 'false' : 'true');
  }
  if (showMap) {
    const pane = document.getElementById('detailPane');
    const inner = document.getElementById('detailPaneInner');
    if (pane && pane.hidden && inner && !inner.querySelector('.card')) {
      inner.innerHTML = '<div class="detail-empty">Toca un pin del mapa para ver fotos y detalles aquí.</div>';
      pane.hidden = false;
      // keep hint visible but don't shrink map until a real selection
      mainPanes.classList.remove('has-detail');
    }
  }
  if (map && showMap) setTimeout(() => map.invalidateSize(), 60);
}

if (filtersToggle && filtersPanel) {
  filtersToggle.addEventListener('click', () => {
    const open = filtersPanel.classList.toggle('open');
    filtersToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    filtersToggle.textContent = open ? 'Ocultar' : 'Filtros';
    if (map) setTimeout(() => map.invalidateSize(), 60);
  });
}
if (tabMap) tabMap.addEventListener('click', () => setMobileView('map'));
if (tabList) tabList.addEventListener('click', () => setMobileView('list'));

window.addEventListener('resize', () => {
  setMobileView(mainPanes && mainPanes.classList.contains('show-list') ? 'list' : 'map');
  if (map) map.invalidateSize();
});

const _render = render;
render = function() {
  _render();
  if (isMobile() && mainPanes && !mainPanes.classList.contains('show-map') && !mainPanes.classList.contains('show-list')) {
    setMobileView('map');
  }
  if (map) setTimeout(() => map.invalidateSize(), 60);
};


let listingPhotoIdx = 0;
let listingOpenId = null;

function listingHashFor(id) {
  return '#anuncio/' + encodeURIComponent(id);
}

function showListingUI(id) {
  const l = listingById(id);
  const page = document.getElementById('listingPage');
  const body = document.getElementById('lpBody');
  if (!l || !page || !body) return false;
  listingOpenId = id;
  activeId = id;
  listingPhotoIdx = 0;
  document.getElementById('lpTopTitle').textContent = l.title || 'Anuncio';
  const fb = document.getElementById('lpFb');
  if (fb) { fb.href = l.url || '#'; }
  body.innerHTML = listingPageHtml(l, listingPhotoIdx);
  page.classList.add('open');
  page.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  wireListingPage(l);
  return true;
}

function hideListingUI() {
  const page = document.getElementById('listingPage');
  if (page) {
    page.classList.remove('open');
    page.setAttribute('aria-hidden', 'true');
  }
  listingOpenId = null;
  document.body.style.overflow = '';
}

function openListing(id, opts = {}) {
  const target = listingHashFor(id);
  const alreadyOpen = listingOpenId === id && document.getElementById('listingPage')?.classList.contains('open');
  if (!showListingUI(id)) return;
  if (opts.skipHistory) return;
  try {
    if (location.hash === target) {
      // Same URL (refresh / re-render): keep entry, don't stack
      history.replaceState({ lamasListing: String(id) }, '', target);
    } else {
      history.pushState({ lamasListing: String(id) }, '', target);
    }
  } catch (_) {}
  void alreadyOpen;
}

function closeListing(opts = {}) {
  const hadHash = (location.hash || '').indexOf('#anuncio/') === 0;
  hideListingUI();
  if (opts.fromPopstate) return;
  try {
    if (hadHash) {
      // Prefer browser back so the hardware/browser back button mirrors Volver
      history.back();
    }
  } catch (_) {}
}

function syncListingRoute() {
  const h = location.hash || '';
  const prefix = '#anuncio/';
  if (h.indexOf(prefix) === 0) {
    const id = decodeURIComponent(h.slice(prefix.length));
    if (!id) return;
    if (listingOpenId !== id || !document.getElementById('listingPage')?.classList.contains('open')) {
      openListing(id, { skipHistory: true });
    }
  } else if (listingOpenId) {
    closeListing({ fromPopstate: true });
  }
}

function listingPageHtml(l, idx) {
  const fotos = l.photos || [];
  const i = fotos.length ? ((idx % fotos.length) + fotos.length) % fotos.length : 0;
  const main = fotos.length
    ? '<div class="lp-gallery">' +
        '<img class="main" src="' + esc(fotos[i]) + '" alt="Foto ' + (i+1) + '" />' +
        (fotos.length > 1
          ? '<button type="button" class="lp-nav prev" data-lp-nav="-1" aria-label="Anterior">‹</button>' +
            '<button type="button" class="lp-nav next" data-lp-nav="1" aria-label="Siguiente">›</button>'
          : '') +
        '<div class="lp-count">' + (i+1) + ' / ' + fotos.length + '</div>' +
      '</div>' +
      (fotos.length > 1
        ? '<div class="lp-thumbs">' + fotos.map((src, ti) =>
            '<button type="button" class="' + (ti === i ? 'active' : '') + '" data-lp-thumb="' + ti + '">' +
            '<img src="' + esc(src) + '" alt="" loading="lazy" /></button>').join('') + '</div>'
        : '')
    : '<div class="lp-gallery"><div class="detail-empty" style="padding:40px;text-align:center">Sin fotos aún</div></div>';

  const pills = [];
  if (l.is_new) pills.push('<span class="pill new">Nuevo</span>');
  if (isDeal(l)) pills.push('<span class="pill deal">Vale la pena</span>');
  if (l.price_unknown) pills.push('<span class="pill">Precio desconocido</span>');
  if (l.reduced_from) pills.push('<span class="pill">Antes ' + esc(String(l.reduced_from)) + '</span>');
  pills.push('<span class="pill">' + esc(locationConfidenceLabel(l.location_confidence)) + '</span>');
  if (l.is_lote === true) pills.push('<span class="pill lote">Lote</span>');
  else if (l.is_lote === false) pills.push('<span class="pill terreno">No es lote</span>');
  else pills.push('<span class="pill">Parcela no clara</span>');

  const interest = getInterest(l.id);
  const landmarks = (l.landmarks || []).filter(Boolean);
  return main +
    '<div class="lp-price' + (l.price_unknown ? ' unknown' : '') + '">' + esc(l.price_display) + '</div>' +
    '<h2 style="margin:0 0 8px;font-size:22px;line-height:1.25">' + esc(l.title) + '</h2>' +
    '<div class="lp-meta">' + pills.join('') +
      '<span class="pill">' + esc(sizeLabel(l)) + '</span>' +
      '<span class="pill">' + (l.distance_km != null ? l.distance_km + ' km desde Lamas' : 'Distancia n/d') + '</span>' +
      '<span class="pill">' + esc(l.place_label || l.location_text || '') + '</span>' +
      '<span class="pill">' + esc(listedLabel(l)) + '</span>' +
    '</div>' +
    (l.deals_notes ? '<div class="lp-section"><h3>Recomendación</h3><div class="lp-deals">' + esc(l.deals_notes) + '</div></div>' : '') +
    '<div class="lp-section"><h3>Descripción</h3><div class="lp-desc">' + esc(l.description || '(Sin texto del anuncio)') + '</div></div>' +
    (landmarks.length ? '<div class="lp-section"><h3>Pistas de ubicación</h3><ul>' +
      landmarks.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '') +
    '<div class="lp-section"><h3>Interés</h3><div class="interest-row" data-listing-id="' + esc(l.id) + '">' +
      '<button type="button" class="mark-yes' + (interest === 'interested' ? ' active-yes' : '') + '" data-mark="interested">Me interesa</button>' +
      '<button type="button" class="mark-no' + (interest === 'not_interested' ? ' active-no' : '') + '" data-mark="not_interested">No me interesa</button>' +
      '<button type="button" class="mark-clear" data-mark="clear">Quitar</button>' +
    '</div></div>' +
    '<div class="lp-actions">' +
      '<a class="fb" href="' + esc(l.url) + '" target="_blank" rel="noopener">Abrir anuncio en Facebook ↗</a>' +
    '</div>';
}

function wireListingPage(l) {
  const body = document.getElementById('lpBody');
  if (!body) return;
  body.querySelectorAll('[data-lp-nav]').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      const fotos = l.photos || [];
      if (!fotos.length) return;
      listingPhotoIdx = (listingPhotoIdx + Number(btn.getAttribute('data-lp-nav'))) % fotos.length;
      if (listingPhotoIdx < 0) listingPhotoIdx += fotos.length;
      body.innerHTML = listingPageHtml(l, listingPhotoIdx);
      wireListingPage(l);
    };
  });
  body.querySelectorAll('[data-lp-thumb]').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      listingPhotoIdx = Number(btn.getAttribute('data-lp-thumb')) || 0;
      body.innerHTML = listingPageHtml(l, listingPhotoIdx);
      wireListingPage(l);
    };
  });
}

document.getElementById('lpBack')?.addEventListener('click', () => closeListing());

function bootListingRoute() {
  const h = location.hash || '';
  const prefix = '#anuncio/';
  if (h.indexOf(prefix) === 0) {
    const id = decodeURIComponent(h.slice(prefix.length));
    // Deep link: home entry then listing, so Back closes ficha instead of leaving the site
    try {
      history.replaceState({ lamasHome: true }, '', location.pathname + location.search);
      history.pushState({ lamasListing: String(id) }, '', listingHashFor(id));
    } catch (_) {}
    openListing(id, { skipHistory: true });
  } else {
    try { history.replaceState({ lamasHome: true }, '', location.pathname + location.search + location.hash); } catch (_) {}
  }
}
window.addEventListener('popstate', syncListingRoute);
window.addEventListener('hashchange', syncListingRoute);

document.addEventListener('keydown', (e) => {
  if (!listingOpenId) return;
  if (e.key === 'Escape') { closeListing(); return; }
  const l = listingById(listingOpenId);
  if (!l || !(l.photos || []).length) return;
  if (e.key === 'ArrowRight') {
    listingPhotoIdx = (listingPhotoIdx + 1) % l.photos.length;
    document.getElementById('lpBody').innerHTML = listingPageHtml(l, listingPhotoIdx);
    wireListingPage(l);
  } else if (e.key === 'ArrowLeft') {
    listingPhotoIdx = (listingPhotoIdx - 1 + l.photos.length) % l.photos.length;
    document.getElementById('lpBody').innerHTML = listingPageHtml(l, listingPhotoIdx);
    wireListingPage(l);
  }
});



// Event delegation: interest + desc toggle (list and map detail)
document.addEventListener('click', (e) => {
  const openBtn = e.target.closest('[data-open-listing], button.open-listing');
  if (openBtn) {
    e.preventDefault();
    e.stopPropagation();
    const id = openBtn.getAttribute('data-open-listing') || openBtn.closest('.card')?.dataset?.id;
    if (id) openListing(id);
    return;
  }
  const interestBtn = e.target.closest('.interest-row button');
  if (interestBtn) {
    e.preventDefault();
    e.stopPropagation();
    const card = interestBtn.closest('.card');
    const row = interestBtn.closest('.interest-row');
    const id = (card && card.dataset.id) || (row && row.getAttribute('data-listing-id')) || listingOpenId;
    if (!id) return;
    const mark = interestBtn.getAttribute('data-mark');
    // Quitar / empty / explicit clear → remove mark
    const clear = interestBtn.classList.contains('mark-clear') || !mark || mark === 'clear';
    setInterest(id, clear ? null : mark);
    return;
  }
  const toggle = e.target.closest('button.toggle-desc');
  if (toggle) {
    e.preventDefault();
    e.stopPropagation();
    const d = toggle.previousElementSibling;
    if (!d || !d.classList.contains('desc')) return;
    const clamped = d.classList.toggle('clamp');
    toggle.textContent = clamped ? 'Ver anuncio completo' : 'Ocultar anuncio';
  }
}, true);

setMobileView('map');
loadInterestFromFile().finally(() => { render(); bootListingRoute(); });


</script>
